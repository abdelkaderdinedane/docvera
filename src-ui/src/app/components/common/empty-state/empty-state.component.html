<div class="docvera-empty-state" [class.compact]="compact">
  <div class="empty-icon">
    <i-bs [name]="icon"></i-bs>
  </div>
  @if (heading) {
    <div class="empty-heading" role="heading" [attr.aria-level]="headingLevel">{{ heading }}</div>
  }
  @if (body) {
    <p class="empty-body">{{ body }}</p>
  }
  @if (actionLabel) {
    <a class="btn btn-sm btn-primary empty-action" [routerLink]="actionLink">
      {{ actionLabel }}
    </a>
  }
</div>
